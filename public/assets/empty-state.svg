<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="emptyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="160" cy="110" r="95" fill="url(#emptyGlow)" />

  <!-- Shadow under journal -->
  <ellipse cx="160" cy="175" rx="100" ry="14" fill="#78350F" opacity="0.12" />

  <!-- Open Recipe Journal -->
  <g transform="translate(45, 60)">
    <!-- Cover board behind -->
    <rect x="0" y="0" width="230" height="110" rx="6" fill="#9A3412" />
    
    <!-- Left open page -->
    <path d="M5 5 L112 8 L112 105 L5 102 Z" fill="#FFFDF8" stroke="#FBBF24" stroke-width="1" />
    <!-- Right open page -->
    <path d="M118 8 L225 5 L225 102 L118 105 Z" fill="#FFFDF8" stroke="#FBBF24" stroke-width="1" />
    <!-- Spine binding -->
    <line x1="115" y1="5" x2="115" y2="105" stroke="#78350F" stroke-width="2" />

    <!-- Left page subtle dotted guides -->
    <line x1="20" y1="25" x2="98" y2="25" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="20" y1="42" x2="95" y2="42" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="20" y1="59" x2="100" y2="59" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="20" y1="76" x2="85" y2="76" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5" />

    <!-- Right page cute heart & spoon sketch -->
    <path d="M165 42 C165 30 150 30 150 42 C150 52 165 62 165 62 C165 62 180 52 180 42 C180 30 165 30 165 42 Z" fill="#F87171" opacity="0.5" />
    
    <!-- Feather quill / Pen -->
    <path d="M190 20 C180 45 150 75 140 85" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <polygon points="138,87 144,83 141,80" fill="#78350F" />
  </g>

  <!-- Steaming cup of tea / Bhar (earthen cup) on the left -->
  <g transform="translate(25, 110)">
    <ellipse cx="20" cy="50" rx="15" ry="4" fill="#78350F" opacity="0.2" />
    <path d="M8 25 L12 48 C12 50 28 50 28 48 L32 25 Z" fill="#B45309" />
    <ellipse cx="20" cy="25" rx="12" ry="4" fill="#78350F" />
    <ellipse cx="20" cy="25" rx="10" ry="3" fill="#D97706" />
    <!-- Steam -->
    <path d="M18 18 C16 12 24 8 20 2" stroke="#D97706" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
