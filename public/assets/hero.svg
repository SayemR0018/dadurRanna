<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="clayPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#451A03" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" rx="16" fill="url(#heroBg)" />
  <circle cx="300" cy="180" r="170" fill="url(#sunGlow)" />

  <!-- Background Alpana Mandala Rings -->
  <g opacity="0.25" stroke="#B45309" stroke-width="1.5" fill="none">
    <circle cx="300" cy="180" r="140" stroke-dasharray="6 4" />
    <circle cx="300" cy="180" r="110" />
    <!-- 8 Alpana Petals radiating -->
    <path d="M300 45 C290 60 310 60 300 45 Z" fill="#B45309" />
    <path d="M300 315 C290 300 310 300 300 315 Z" fill="#B45309" />
    <path d="M165 180 C180 170 180 190 165 180 Z" fill="#B45309" />
    <path d="M435 180 C420 170 420 190 435 180 Z" fill="#B45309" />
  </g>

  <!-- Wooden Kitchen Counter Surface -->
  <path d="M40 280 Q300 290 560 280 L560 340 Q300 350 40 340 Z" fill="#78350F" opacity="0.12" />
  <rect x="50" y="280" width="500" height="12" rx="6" fill="#D97706" opacity="0.4" />

  <!-- Banana Leaf Platter (Left side) -->
  <g filter="url(#shadowFilter)">
    <path d="M70 290 C60 240 90 200 170 190 C220 185 240 215 220 265 C200 305 130 315 70 290 Z" fill="url(#leafGrad)" />
    <!-- Leaf veins -->
    <path d="M75 285 C110 260 170 230 215 210" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M110 260 C125 245 145 240 160 242" stroke="#86EFAC" stroke-width="1.2" fill="none" opacity="0.5" />
    <path d="M140 240 C155 225 175 220 190 222" stroke="#86EFAC" stroke-width="1.2" fill="none" opacity="0.5" />
    <path d="M100 275 C115 285 135 288 150 285" stroke="#86EFAC" stroke-width="1.2" fill="none" opacity="0.5" />
  </g>

  <!-- Fresh Mustard Flowers on Leaf -->
  <circle cx="150" cy="225" r="4" fill="#FACC15" />
  <circle cx="156" cy="223" r="3.5" fill="#FACC15" />
  <circle cx="152" cy="231" r="3.5" fill="#FACC15" />
  <circle cx="145" cy="228" r="3" fill="#FDE047" />

  <!-- Fresh Chillies on Leaf -->
  <!-- Red Chilli -->
  <path d="M120 270 C140 260 165 272 170 280 C165 285 145 280 120 270 Z" fill="#DC2626" />
  <path d="M118 269 C113 266 112 263 114 260" stroke="#15803D" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Green Chilli -->
  <path d="M135 255 C155 245 175 252 180 258 C172 263 155 260 135 255 Z" fill="#16A34A" />
  <path d="M133 255 C129 252 128 249 130 246" stroke="#14532D" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Traditional Earthen Handi (Center) -->
  <g filter="url(#shadowFilter)">
    <!-- Base shadow -->
    <ellipse cx="300" cy="290" rx="75" ry="15" fill="#451A03" opacity="0.25" />

    <!-- Pot Body -->
    <path d="M225 210 C220 275 250 288 300 288 C350 288 380 275 375 210 C370 185 350 172 340 168 L260 168 C250 172 230 185 225 210 Z" fill="url(#clayPot)" />

    <!-- Pot Neck & Lip -->
    <ellipse cx="300" cy="168" rx="55" ry="12" fill="#7C2D12" />
    <ellipse cx="300" cy="162" rx="58" ry="10" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2" />
    <ellipse cx="300" cy="162" rx="48" ry="7" fill="#451A03" />

    <!-- Alpana decorative garland on pot -->
    <path d="M238 215 Q300 238 362 215" fill="none" stroke="#FEF3C7" stroke-width="3.5" stroke-linecap="round" />
    <g fill="#FEF3C7">
      <path d="M260 226 C260 234 272 234 272 226 C272 220 260 220 260 226 Z" />
      <path d="M285 231 C285 239 297 239 297 231 C297 225 285 225 285 231 Z" />
      <path d="M310 231 C310 239 322 239 322 231 C322 225 310 225 310 231 Z" />
      <path d="M335 226 C335 234 347 234 347 226 C347 220 335 220 335 226 Z" />
    </g>
  </g>

  <!-- Wooden Spatula (Khunti) Resting in Pot -->
  <g transform="rotate(22 300 160)">
    <rect x="294" y="65" width="12" height="125" rx="6" fill="#B45309" stroke="#78350F" stroke-width="1.5" />
    <!-- Khunti blade -->
    <path d="M284 65 C284 50 316 50 316 65 L314 90 C314 96 286 96 286 90 Z" fill="#D97706" />
  </g>

  <!-- Floating Aromatic Steam (Animated / Organic Flow) -->
  <g stroke="#D97706" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M275 145 C265 125 285 105 270 80 C260 65 272 50 280 35" />
    <path d="M305 140 C320 115 300 95 315 70 C325 55 315 40 320 25" stroke-width="4" stroke="#B45309" />
    <path d="M335 145 C345 125 325 108 340 85 C350 70 340 55 345 42" />
  </g>

  <!-- Grandmother's Handwritten Recipe Notebook (Right Side) -->
  <g filter="url(#shadowFilter)" transform="rotate(-6 450 240)">
    <!-- Open Journal Base -->
    <rect x="380" y="180" width="150" height="105" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
    <!-- Center seam spine -->
    <line x1="455" y1="180" x2="455" y2="285" stroke="#B45309" stroke-width="2" stroke-dasharray="4 2" />
    
    <!-- Notebook Left Page lines (Bangla script simulation) -->
    <line x1="395" y1="198" x2="442" y2="198" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="395" y1="212" x2="435" y2="212" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="395" y1="226" x2="440" y2="226" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="395" y1="240" x2="425" y2="240" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="395" y1="254" x2="438" y2="254" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />

    <!-- Notebook Right Page lines -->
    <line x1="468" y1="198" x2="515" y2="198" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="468" y1="212" x2="510" y2="212" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="468" y1="226" x2="518" y2="226" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <line x1="468" y1="240" x2="505" y2="240" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <!-- Handwritten bookmark ribbon -->
    <path d="M455 180 C465 170 475 160 480 150" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Yellow sticky highlighter note on recipe -->
    <rect x="470" y="248" width="45" height="18" rx="2" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
    <text x="474" y="261" font-size="8" font-family="sans-serif" fill="#713F12" font-weight="bold">অন্দাজমতো?</text>
  </g>

  <!-- Brass Bell / Small spice bowl -->
  <ellipse cx="525" cy="295" rx="22" ry="8" fill="#451A03" opacity="0.2" />
  <path d="M505 285 C505 295 545 295 545 285 L543 278 L507 278 Z" fill="url(#brassGrad)" stroke="#78350F" stroke-width="1" />
  <ellipse cx="525" cy="278" rx="18" ry="5" fill="#F59E0B" />
  <!-- Nigella seeds (kalo jeere) in spice bowl -->
  <circle cx="520" cy="278" r="1.5" fill="#1F2937" />
  <circle cx="525" cy="277" r="1.5" fill="#1F2937" />
  <circle cx="530" cy="279" r="1.5" fill="#1F2937" />
  <circle cx="523" cy="280" r="1.5" fill="#1F2937" />
</svg>
