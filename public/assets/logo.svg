<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="potGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="spoonWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle badge -->
  <circle cx="120" cy="120" r="112" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4" stroke-dasharray="8 4" />
  
  <!-- Outer subtle ring -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#B45309" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Wooden Spatula (Khunti) angled in pot -->
  <g transform="rotate(28 120 120)">
    <rect x="114" y="24" width="12" height="110" rx="6" fill="url(#spoonWood)" filter="url(#softGlow)" />
    <!-- Spatula head -->
    <path d="M106 30 C106 20 134 20 134 30 L132 50 C132 54 108 54 108 50 Z" fill="#D97706" />
    <!-- Notch -->
    <circle cx="120" cy="122" r="3" fill="#78350F" />
  </g>

  <!-- Clay Pot (Handi / Dekchi) Body -->
  <g filter="url(#softGlow)">
    <!-- Base shadow -->
    <ellipse cx="120" cy="192" rx="55" ry="12" fill="#7C2D12" opacity="0.3" />
    
    <!-- Pot belly -->
    <path d="M60 135 C60 185 85 192 120 192 C155 192 180 185 180 135 C180 115 165 105 155 102 L85 102 C75 105 60 115 60 135 Z" fill="url(#potGrad)" />

    <!-- Pot neck & lip -->
    <ellipse cx="120" cy="102" rx="42" ry="10" fill="#7C2D12" />
    <ellipse cx="120" cy="98" rx="44" ry="9" fill="url(#goldRim)" stroke="#9A3412" stroke-width="2" />
    <ellipse cx="120" cy="98" rx="36" ry="6" fill="#431407" />
  </g>

  <!-- Alpana decorative band on clay pot -->
  <path d="M72 135 Q120 152 168 135" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" />
  <!-- Alpana petals -->
  <path d="M85 140 C85 146 95 146 95 140 C95 136 85 136 85 140 Z" fill="#FEF3C7" />
  <path d="M105 144 C105 150 115 150 115 144 C115 140 105 140 105 144 Z" fill="#FEF3C7" />
  <path d="M125 144 C125 150 135 150 135 144 C135 140 125 140 125 144 Z" fill="#FEF3C7" />
  <path d="M145 140 C145 146 155 146 155 140 C155 136 145 136 145 140 Z" fill="#FEF3C7" />

  <!-- Steam curls rising -->
  <g stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M100 88 C95 75 105 65 98 52 C94 44 98 38 102 32">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
        M100 88 C95 75 105 65 98 52 C94 44 98 38 102 32;
        M100 88 C105 75 95 65 102 52 C106 44 102 38 98 32;
        M100 88 C95 75 105 65 98 52 C94 44 98 38 102 32" />
    </path>
    <path d="M120 84 C126 70 114 60 122 46 C128 38 122 30 124 22" stroke-width="3.5">
      <animate attributeName="d" dur="2.5s" repeatCount="indefinite" values="
        M120 84 C126 70 114 60 122 46 C128 38 122 30 124 22;
        M120 84 C114 70 126 60 118 46 C112 38 118 30 116 22;
        M120 84 C126 70 114 60 122 46 C128 38 122 30 124 22" />
    </path>
    <path d="M140 88 C145 76 135 66 142 54 C146 46 142 40 138 34">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite" values="
        M140 88 C145 76 135 66 142 54 C146 46 142 40 138 34;
        M140 88 C135 76 145 66 138 54 C134 46 138 40 142 34;
        M140 88 C145 76 135 66 142 54 C146 46 142 40 138 34" />
    </path>
  </g>

  <!-- Little green chilli accent on side -->
  <path d="M68 178 C60 170 54 158 58 152 C62 146 72 152 75 162 C78 172 74 180 68 178 Z" fill="#15803D" stroke="#166534" stroke-width="1.5" />
  <path d="M57 150 C54 146 52 142 54 139" fill="none" stroke="#14532D" stroke-width="2" stroke-linecap="round" />
</svg>
