<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Plate Background -->
  <circle cx="100" cy="100" r="92" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3" />
  <circle cx="100" cy="100" r="82" fill="#FFFBEB" />
  
  <!-- Crispy Fried Eggplant Round (Begun Chak) -->
  <g transform="translate(40, 40)">
    <!-- Shadow under fried eggplant -->
    <ellipse cx="60" cy="62" rx="55" ry="48" fill="#451A03" opacity="0.2" />

    <!-- Deep purple/black outer skin rim -->
    <ellipse cx="60" cy="60" rx="54" ry="46" fill="#3B0764" stroke="#581C87" stroke-width="4" />

    <!-- Golden crispy spiced eggplant flesh (pan-fried with turmeric, rice flour, chilli) -->
    <ellipse cx="60" cy="60" rx="48" ry="40" fill="#D97706" />
    <ellipse cx="60" cy="60" rx="44" ry="36" fill="#F59E0B" />

    <!-- Diamond / Crosshatch cuts from grandmother's knife scoring -->
    <g stroke="#92400E" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
      <!-- Diagonal 1 -->
      <line x1="32" y1="40" x2="88" y2="80" />
      <line x1="24" y1="55" x2="80" y2="95" />
      <line x1="45" y1="30" x2="95" y2="65" />
      
      <!-- Diagonal 2 -->
      <line x1="32" y1="80" x2="88" y2="40" />
      <line x1="24" y1="65" x2="80" y2="25" />
      <line x1="45" y1="90" x2="95" y2="55" />
    </g>

    <!-- Crispy toasted rice flour granules & nigella specks on surface -->
    <circle cx="45" cy="50" r="1.5" fill="#FEF08A" />
    <circle cx="65" cy="42" r="1.8" fill="#1F2937" />
    <circle cx="75" cy="55" r="1.5" fill="#FEF08A" />
    <circle cx="52" cy="72" r="1.8" fill="#1F2937" />
    <circle cx="78" cy="74" r="1.5" fill="#FEF08A" />
    <circle cx="60" cy="62" r="1.8" fill="#78350F" />
  </g>

  <!-- Fried Green Chilli resting alongside -->
  <path d="M125 130 C145 138 160 120 162 105" stroke="#15803D" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M125 130 L118 132" stroke="#14532D" stroke-width="2" stroke-linecap="round" />

  <!-- Yellow mustard oil droplets on plate -->
  <circle cx="45" cy="130" r="3" fill="#EAB308" opacity="0.8" />
  <circle cx="55" cy="142" r="2" fill="#EAB308" opacity="0.8" />
  <circle cx="145" cy="70" r="2.5" fill="#EAB308" opacity="0.8" />
</svg>
