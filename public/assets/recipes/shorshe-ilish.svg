<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Plate / Bowl background -->
  <circle cx="100" cy="100" r="92" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" />
  <circle cx="100" cy="100" r="82" fill="#FDE68A" />
  
  <!-- Rich Yellow Mustard Gravy -->
  <circle cx="100" cy="100" r="72" fill="#FBBF24" />
  <path d="M45 100 Q100 135 155 100 Q140 145 100 155 Q60 145 45 100 Z" fill="#F59E0B" opacity="0.6" />

  <!-- Hilsa Fish Cut (Steak / Peti & Gaada shape) -->
  <g transform="translate(42, 60)">
    <!-- Shadow -->
    <path d="M12 40 C35 12 85 12 108 40 C85 68 35 68 12 40 Z" fill="#92400E" opacity="0.25" />
    <!-- Fish meat -->
    <path d="M10 38 C35 8 85 8 110 38 C85 68 35 68 10 38 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <!-- Silver-grey hilsa skin rim -->
    <path d="M10 38 C35 8 85 8 110 38" fill="none" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" />
    <!-- Fish center cavity / Bone -->
    <ellipse cx="60" cy="38" rx="16" ry="10" fill="#FDE047" stroke="#D97706" stroke-width="2" />
    <circle cx="60" cy="38" r="4" fill="#B45309" />
    <!-- Mustard sauce glaze on fish -->
    <path d="M30 35 Q60 22 90 35 Q60 48 30 35 Z" fill="#F59E0B" opacity="0.75" />
  </g>

  <!-- Slit Green Chillies -->
  <!-- Chilli 1 -->
  <path d="M60 70 C75 55 95 62 105 60" stroke="#16A34A" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M60 70 L55 72" stroke="#14532D" stroke-width="2" stroke-linecap="round" />
  <!-- Chilli 2 -->
  <path d="M90 135 C115 140 135 125 145 110" stroke="#15803D" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Nigella Seeds (Kalo Jeere) scattered -->
  <circle cx="85" cy="85" r="2.2" fill="#1F2937" />
  <circle cx="115" cy="80" r="2.2" fill="#1F2937" />
  <circle cx="70" cy="115" r="2" fill="#1F2937" />
  <circle cx="125" cy="120" r="2" fill="#1F2937" />
  <circle cx="102" cy="138" r="2" fill="#1F2937" />
  <circle cx="55" cy="98" r="1.8" fill="#1F2937" />

  <!-- Mustard oil sheen drop -->
  <circle cx="120" cy="100" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="121" cy="99" r="1.5" fill="#FEF08A" />
</svg>
